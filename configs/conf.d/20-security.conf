# ==============================================================================
# Mosquitto Authentication & Authorization Configuration
# Module: 20-security.conf
# ==============================================================================

# Текущий режим: разрешить анонимные подключения (совместимость с локальными демонами)
allow_anonymous true

# ------------------------------------------------------------------------------
# Порядок перехода на защищенный режим с авторизацией:
# 1. Создайте пользователей на роутере:
#    mosquitto_passwd -c /opt/etc/mosquitto/passwd tuya
#    mosquitto_passwd /opt/etc/mosquitto/passwd homeassistant
# 2. Измените директиву:
#    allow_anonymous false
# 3. Раскомментируйте пути к файлам учетных записей и списков контроля доступа:
#    password_file /opt/etc/mosquitto/passwd
#    acl_file /opt/etc/mosquitto/acl
# 4. Перезапустите брокер: /opt/etc/init.d/S80mosquitto restart
# ------------------------------------------------------------------------------

# password_file /opt/etc/mosquitto/passwd
# acl_file /opt/etc/mosquitto/acl
