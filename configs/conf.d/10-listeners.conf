# ==============================================================================
# Mosquitto Listener Configuration
# Module: 10-listeners.conf
# ==============================================================================

# Основной слушатель локальной сети (LAN) и микросервисов роутера
# Порт 1883 доступен устройствам локальной сети и сервисам на роутере
listener 1883 0.0.0.0

# Примечание: Для еще более строгой сетевой изоляции можно заменить строку выше
# на два явных слушателя (LAN-интерфейс роутера + локальная петля):
# listener 1883 192.168.1.1
# listener 1883 127.0.0.1

# Настройки протокола для данного слушателя
protocol mqtt
max_connections 50
