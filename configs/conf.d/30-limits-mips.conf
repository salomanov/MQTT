# ==============================================================================
# Mosquitto Resource Limits Configuration (MIPS MT7621 / 128 MB RAM)
# Module: 30-limits-mips.conf
# ==============================================================================

# Жесткий лимит оперативной памяти брокера (16 МБ)
# Защищает ядро Linux и KeeneticOS от падения по OOM-killer при всплесках трафика
memory_limit 16777216

# Максимальное количество сообщений в очереди для неактивных клиентов (QoS 1 и 2)
max_queued_messages 1000

# Максимальное число одновременных сообщений в полете
max_inflight_messages 20

# Максимальный размер пакета (64 КБ)
# Предотвращает попытки отправки гигантских пейлоадов через брокер
max_packet_size 65536
