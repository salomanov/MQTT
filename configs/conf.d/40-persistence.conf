# ==============================================================================
# Mosquitto Persistence Configuration (Flash Wear Protection)
# Module: 40-persistence.conf
# ==============================================================================

# Сохранение retain-сообщений и подписок между перезапусками
persistence true
persistence_location /opt/var/lib/mosquitto/
persistence_file mosquitto.db

# Защита флеш-памяти USB-накопителя от преждевременного износа:
# Сохранять базу данных на диск не чаще одного раза в 1800 секунд (30 минут)
autosave_interval 1800

# Не инициировать запись на диск при каждом изменении retain-топика
autosave_on_changes false
