# ==============================================================================
# Mosquitto MQTT Broker Configuration
# Target: Xiaomi Mi WiFi Router 3G v1 (KeeneticOS + Entware, MIPS MT7621)
# Router location: /opt/etc/mosquitto/mosquitto.conf
# ==============================================================================

# Логирование (syslog и файл на накопителе)
log_dest file /opt/var/log/mosquitto.log
log_dest syslog
log_type error
log_type warning
log_type notice
log_timestamp true

# Подключение модульных конфигурационных файлов из каталога conf.d/
# Порядок загрузки определяется лексикографически (10-, 20-, 30-...)
include_dir /opt/etc/mosquitto/conf.d
